  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  .stage {
    position: relative;
    width: 1280px;
    height: 720px;
    /* Deep charcoal -> black, soft and directional */
    background:
      radial-gradient(120% 90% at 26% 42%, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0) 46%),
      radial-gradient(80% 75% at 80% 52%, rgba(255,255,255,0.030) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(145deg, #26262b 0%, #171719 46%, #0b0b0d 100%);
  }
  /* Edge vignette so a composited subject on the right blends into the frame */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 78% 86% at 50% 48%,
      rgba(0,0,0,0) 52%, rgba(0,0,0,0.38) 100%);
    pointer-events: none;
  }
  .text {
    position: absolute;
    left: 86px;
    top: 50%;
    transform: translateY(-50%);
    width: 620px;                 /* stays within the left 55% (704px) */
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    line-height: 0.9;
  }
  .l1, .l2 {
    font-size: 150px;
    color: #ffffff;
    letter-spacing: 1px;
  }
  .l2 { margin-top: 6px; }
  .l3 {
    font-size: 212px;
    color: #FBBF24;              /* warm golden yellow */
    letter-spacing: 1px;
    margin-top: 14px;
  }
</style>

  <div class="stage">
    <div class="text">
      <div class="l1">Retire</div>
      <div class="l2">To</div>
      <div class="l3">What?</div>
    </div>
    <div class="vignette"></div>
  </div>
</body>
